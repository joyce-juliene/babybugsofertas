<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baby Bugs - Ofertas e Cupons</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI',sans-serif;background:#F7F3EE;min-height:100vh}
.header{background:#1C1C1C;padding:16px 20px;border-bottom:4px solid #FFC107;position:sticky;top:0;z-index:100}
.header-inner{display:flex;align-items:center;gap:14px;max-width:700px;margin:0 auto}
.header img{width:56px;height:56px;border-radius:50%;border:3px solid #FFC107}
.header h1{font-size:20px;color:#FFC107;font-weight:900;letter-spacing:1px}
.header p{font-size:12px;color:#aaa;margin-top:2px}
.tabs{display:flex;gap:10px;max-width:700px;margin:16px auto 0;padding:0 16px}
.tab{flex:1;padding:10px;text-align:center;border-radius:12px;cursor:pointer;font-size:14px;font-weight:700;background:#fff;color:#777;border:2px solid #eee;transition:all .2s}
.tab.on{background:#1C1C1C;color:#FFC107;border-color:#1C1C1C}
.info{text-align:center;padding:10px 0 4px;font-size:13px;color:#999}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;max-width:1000px;margin:12px auto;padding:0 16px 40px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.07);position:relative}
.bdesc{position:absolute;top:10px;right:10px;background:#E53935;color:#fff;font-size:12px;font-weight:800;padding:4px 10px;border-radius:20px;z-index:2}
.bcup{position:absolute;top:10px;left:10px;background:#FFC107;color:#1C1C1C;font-size:11px;font-weight:800;padding:4px 9px;border-radius:20px;z-index:2}
.foto-wrap{width:100%;height:200px;background:#fafafa;display:flex;align-items:center;justify-content:center;overflow:hidden}
.foto-wrap img{max-width:100%;max-height:100%;object-fit:contain;padding:14px}
.foto-wrap .ph{font-size:60px}
.body{padding:14px 16px 18px}
.nome{font-size:14px;font-weight:600;color:#333;line-height:1.4;margin-bottom:10px;min-height:40px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.data{font-size:11px;color:#bbb;margin-bottom:8px}
.precos{display:flex;align-items:baseline;gap:10px;margin-bottom:4px;flex-wrap:wrap}
.de{text-decoration:line-through;color:#bbb;font-size:13px}
.por{font-size:24px;font-weight:900;color:#E53935}
.eco{font-size:12px;color:#555;margin-bottom:12px}
.cupom-box{background:#FFF8E1;border:2px dashed #FFC107;border-radius:8px;padding:8px 12px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.clabel{font-size:11px;color:#888;display:block}
.ccode{font-size:17px;font-weight:900;color:#E65100;letter-spacing:1px}
.cbtn{margin-left:auto;background:#FFC107;border:none;border-radius:6px;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer;color:#1C1C1C}
.comprar{display:block;text-align:center;background:#1C1C1C;color:#FFC107;padding:12px;border-radius:10px;text-decoration:none;font-weight:700;font-size:14px;margin-top:2px}
.vazio{text-align:center;padding:60px 20px;grid-column:1/-1}
.vazio .big{font-size:50px;margin-bottom:14px}
.vazio h2{font-size:18px;color:#444;margin-bottom:8px}
.vazio p{font-size:13px;color:#999}
.footer{text-align:center;padding:24px 16px;color:#bbb;font-size:12px;border-top:1px solid #eee}
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#1C1C1C;color:#FFC107;padding:10px 22px;border-radius:20px;font-size:13px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;white-space:nowrap}
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <img src="logo.png" alt="Baby Bugs" onerror="this.style.display='none'">
    <div>
      <h1>BABY BUGS</h1>
      <p>Ofertas e cupons para bebes e criancas</p>
    </div>
  </div>
</div>

<div class="tabs">
  <div class="tab on" id="t-todos" onclick="filtrar(0)">Todas as Ofertas</div>
  <div class="tab" id="t-cupons" onclick="filtrar(1)">Cupons Ativos</div>
</div>

<p class="info" id="info"></p>
<div class="grid" id="grid"></div>

<div class="footer">
  Atualizado automaticamente pelo Bot Baby Bugs<br>
  Os precos podem variar. Confira sempre antes de comprar.
</div>

<div id="toast"></div>

<script>
var dados = [];
var modo = 0;

function fmt(v) {
  return parseFloat(v).toFixed(2).replace('.', ',');
}

function copiar(c) {
  var t = document.getElementById('toast');
  try { navigator.clipboard.writeText(c); } catch(e) {}
  t.textContent = 'Cupom "' + c + '" copiado!';
  t.style.opacity = '1';
  setTimeout(function(){ t.style.opacity = '0'; }, 2500);
}

function filtrar(m) {
  modo = m;
  document.getElementById('t-todos').className = 'tab' + (m === 0 ? ' on' : '');
  document.getElementById('t-cupons').className = 'tab' + (m === 1 ? ' on' : '');
  renderizar();
}

function renderizar() {
  var lista = modo === 1 ? dados.filter(function(p){ return p.cupom; }) : dados;
  var info = document.getElementById('info');
  var grid = document.getElementById('grid');

  info.textContent = lista.length ? lista.length + ' oferta(s) disponivel(is)' : '';

  if (!lista.length) {
    grid.innerHTML = '<div class="vazio"><div class="big">🐞</div><h2>Nenhuma oferta no momento</h2><p>Fique de olho nos nossos Stories!</p></div>';
    return;
  }

  var html = '';
  for (var i = 0; i < lista.length; i++) {
    var p = lista[i];
    var desc = p.preco_original > 0 ? Math.round((1 - p.preco_atual / p.preco_original) * 100) : 0;
    var eco = p.preco_original > 0 ? fmt(p.preco_original - p.preco_atual) : null;

    var foto = p.foto_url
      ? '<img src="' + p.foto_url + '" alt="produto" onerror="this.style.display=\'none\'">'
      : '<div class="ph">👶</div>';

    var cupomHtml = '';
    if (p.cupom) {
      cupomHtml = '<div class="cupom-box"><div><span class="clabel">Codigo do cupom</span><span class="ccode">' + p.cupom + '</span></div><button class="cbtn" onclick="copiar(\'' + p.cupom + '\')">Copiar</button></div>';
    }

    var de = p.preco_original > 0 ? '<span class="de">R$ ' + fmt(p.preco_original) + '</span>' : '';
    var ecoHtml = (eco && desc > 0) ? '<div class="eco">Economia de R$ ' + eco + ' (' + desc + '% OFF)</div>' : '';
    var dataHtml = p.postado_em ? '<div class="data">Postado em ' + p.postado_em + '</div>' : '';

    html += '<div class="card">';
    if (p.cupom) html += '<div class="bcup">Cupom</div>';
    if (desc > 0) html += '<div class="bdesc">-' + desc + '%</div>';
    html += '<div class="foto-wrap">' + foto + '</div>';
    html += '<div class="body">';
    html += '<div class="nome">' + p.nome + '</div>';
    html += dataHtml;
    html += '<div class="precos">' + de + '<span class="por">R$ ' + fmt(p.preco_atual) + '</span></div>';
    html += ecoHtml;
    html += cupomHtml;
    html += '<a href="' + p.link_afiliado + '" target="_blank" class="comprar">Comprar na Amazon</a>';
    html += '</div></div>';
  }
  grid.innerHTML = html;
}

function carregar() {
  var xhr = new XMLHttpRequest();
  xhr.open('GET', 'produtos.json?t=' + Date.now(), true);
  xhr.onload = function() {
    if (xhr.status === 200) {
      try { dados = JSON.parse(xhr.responseText); } catch(e) { dados = []; }
    } else { dados = []; }
    renderizar();
  };
  xhr.onerror = function() { dados = []; renderizar(); };
  xhr.send();
}

carregar();
setInterval(carregar, 300000);
</script>
</body>
</html>
