<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baby Bugs — Ofertas e Cupons</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #F7F3EE; min-height: 100vh; }

  .header { background: #1C1C1C; padding: 20px; text-align: center; border-bottom: 4px solid #FFC107; position: sticky; top: 0; z-index: 100; }
  .header-inner { display: flex; align-items: center; justify-content: center; gap: 14px; max-width: 600px; margin: 0 auto; }
  .header img { width: 60px; height: 60px; border-radius: 50%; border: 3px solid #FFC107; }
  .header h1 { font-size: 22px; color: #FFC107; font-weight: 800; letter-spacing: 1px; }
  .header p { font-size: 12px; color: #AAAAAA; margin-top: 2px; }

  .tabs { display: flex; gap: 10px; max-width: 700px; margin: 20px auto 0; padding: 0 16px; }
  .tab { flex: 1; padding: 10px; text-align: center; border-radius: 12px; cursor: pointer; font-size: 14px; font-weight: 700; background: #fff; color: #777; border: 2px solid #EEE; transition: all 0.2s; }
  .tab.ativo { background: #1C1C1C; color: #FFC107; border-color: #1C1C1C; }

  .contagem { text-align: center; padding: 12px 0 4px; font-size: 13px; color: #999; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; max-width: 1000px; margin: 12px auto; padding: 0 16px 40px; }

  .card { background: #fff; border-radius: 18px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.07); transition: transform 0.2s; position: relative; }
  .card:hover { transform: translateY(-4px); }

  .badge-desc { position: absolute; top: 12px; right: 12px; background: #E53935; color: #fff; font-size: 13px; font-weight: 800; padding: 5px 12px; border-radius: 20px; z-index: 2; }
  .badge-cup { position: absolute; top: 12px; left: 12px; background: #FFC107; color: #1C1C1C; font-size: 12px; font-weight: 800; padding: 5px 10px; border-radius: 20px; z-index: 2; }

  .card-foto-wrap { width: 100%; height: 220px; background: #FAFAFA; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .card-foto-wrap img { max-width: 100%; max-height: 100%; object-fit: contain; padding: 16px; }
  .card-foto-wrap .placeholder { font-size: 64px; }

  .card-body { padding: 16px 18px 20px; }
  .card-nome { font-size: 15px; font-weight: 600; color: #333; line-height: 1.4; margin-bottom: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 42px; }

  .precos { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; flex-wrap: wrap; }
  .preco-de { text-decoration: line-through; color: #BBB; font-size: 14px; }
  .preco-por { font-size: 26px; font-weight: 800; color: #E53935; }

  .economia { font-size: 13px; color: #555; margin-bottom: 14px; }

  .cupom-box { background: #FFF8E1; border: 2px dashed #FFC107; border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .cupom-label { font-size: 11px; color: #888; display: block; }
  .cupom-codigo { font-size: 18px; font-weight: 800; color: #E65100; letter-spacing: 1px; }
  .cupom-btn { margin-left: auto; background: #FFC107; border: none; border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 700; cursor: pointer; color: #1C1C1C; }

  .btn-comprar { display: block; text-align: center; background: #1C1C1C; color: #FFC107; padding: 14px; border-radius: 12px; text-decoration: none; font-weight: 700; font-size: 15px; }
  .btn-comprar:hover { background: #333; }

  .postado-em { font-size: 11px; color: #BBB; margin-bottom: 10px; }

  .vazio { text-align: center; padding: 80px 20px; grid-column: 1/-1; }
  .vazio .emoji { font-size: 56px; margin-bottom: 16px; }
  .vazio h2 { font-size: 20px; color: #444; margin-bottom: 8px; }
  .vazio p { font-size: 14px; color: #999; }

  .footer { text-align: center; padding: 30px 20px; color: #BBB; font-size: 12px; border-top: 1px solid #EEE; }

  .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1C1C1C; color: #FFC107; padding: 12px 24px; border-radius: 20px; font-size: 14px; font-weight: 600; opacity: 0; transition: opacity 0.3s; z-index: 999; pointer-events: none; }
  .toast.show { opacity: 1; }

  @media (max-width: 480px) { .grid { grid-template-columns: 1fr; } .header h1 { font-size: 18px; } }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <img src="logo.png" alt="Baby Bugs" onerror="this.style.display='none'">
    <div>
      <h1>BABY BUGS</h1>
      <p>Ofertas e cupons para bebês e crianças</p>
    </div>
  </div>
</div>

<div class="tabs">
  <div class="tab ativo" onclick="filtrar('todos')" id="tab-todos">Todas as Ofertas</div>
  <div class="tab" onclick="filtrar('cupom')" id="tab-cupons">Cupons Ativos</div>
</div>

<p class="contagem" id="contagem"></p>
<div class="grid" id="grid"></div>

<div class="footer">
  Atualizado automaticamente pelo Bot Baby Bugs<br>
  Os preços podem variar. Confira sempre antes de comprar.
</div>

<div class="toast" id="toast"></div>

<script>
  let todos = [];
  let filtroAtual = 'todos';

  function fmt(v) {
    return Number(v).toFixed(2).replace('.', ',');
  }

  async function carregar() {
    try {
      const r = await fetch('produtos.json?t=' + Date.now());
      todos = r.ok ? await r.json() : [];
    } catch(e) { todos = []; }
    renderizar();
  }

  function filtrar(tipo) {
    filtroAtual = tipo;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('ativo'));
    document.getElementById('tab-' + (tipo === 'todos' ? 'todos' : 'cupons')).classList.add('ativo');
    renderizar();
  }

  function renderizar() {
    const lista = filtroAtual === 'cupom' ? todos.filter(p => p.cupom) : todos;
    const cont  = document.getElementById('contagem');
    cont.textContent = lista.length ? lista.length + ' oferta(s) disponível(is)' : '';

    if (!lista.length) {
      document.getElementById('grid').innerHTML = `
        <div class="vazio">
          <div class="emoji">🐞</div>
          <h2>Nenhuma oferta no momento</h2>
          <p>Fique de olho nos nossos Stories!</p>
        </div>`;
      return;
    }

    document.getElementById('grid').innerHTML = lista.map(p => {
      const desc = p.preco_original > 0 ? Math.round((1 - p.preco_atual / p.preco_original) * 100) : 0;
      const eco  = p.preco_original > 0 ? fmt(p.preco_original - p.preco_atual) : null;

      const fotoHtml = p.foto_url
        ? `<img src="${p.foto_url}" alt="${p.nome}" crossorigin="anonymous" onerror="this.parentElement.innerHTML='<div class=placeholder>👶</div>'">`
        : `<div class="placeholder">👶</div>`;

      const cupomHtml = p.cupom ? `
        <div class="cupom-box">
          <div>
            <span class="cupom-label">Código do cupom</span>
            <span class="cupom-codigo">${p.cupom}</span>
          </div>
          <button class="cupom-btn" onclick="copiar('${p.cupom}')">Copiar</button>
        </div>` : '';

      return `
        <div class="card">
          ${p.cupom ? '<div class="badge-cup">Cupom</div>' : ''}
          ${desc > 0 ? `<div class="badge-desc">-${desc}%</div>` : ''}
          <div class="card-foto-wrap">${fotoHtml}</div>
          <div class="card-body">
            <div class="card-nome">${p.nome}</div>
            ${p.postado_em ? `<div class="postado-em">Postado em ${p.postado_em}</div>` : ''}
            <div class="precos">
              ${p.preco_original > 0 ? `<span class="preco-de">R$ ${fmt(p.preco_original)}</span>` : ''}
              <span class="preco-por">R$ ${fmt(p.preco_atual)}</span>
            </div>
            ${eco && desc > 0 ? `<div class="economia">Economia de R$ ${eco} (${desc}% OFF)</div>` : ''}
            ${cupomHtml}
            <a href="${p.link_afiliado}" target="_blank" class="btn-comprar">Comprar na Amazon →</a>
          </div>
        </div>`;
    }).join('');
  }

  function copiar(codigo) {
    navigator.clipboard.writeText(codigo).catch(() => {});
    const t = document.getElementById('toast');
    t.textContent = `Cupom "${codigo}" copiado!`;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  carregar();
  setInterval(carregar, 300000);
</script>
</body>
</html>
